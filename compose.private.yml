name: german-tutor
services:
  tutor:
    build:
      context: .
      dockerfile: Dockerfile.private
    restart: unless-stopped
    init: true
    env_file: .env.tutor
    ports:
      - "127.0.0.1:18090:8080"
    environment:
      ALLOWED_ORIGINS: http://127.0.0.1:18090,http://localhost:18090
    volumes:
      - tutor-progress:/data/tutor
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/healthz', headers={'Host': '127.0.0.1:18090'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  tutor-progress:
